aid: skysafe
name: SkySafe
description: >-
  SkySafe is a San Diego-based drone-detection and airspace-intelligence company
  (founded 2015, backed by a16z) whose cloud SaaS platform lets airports, critical
  infrastructure, law enforcement, universities, correctional facilities, and
  government customers detect, track, analyze, and act on every drone in their
  airspace in real time. The platform surfaces precise drone location, altitude,
  velocity, flight status, launch point, and pilot location, receives and analyzes
  Remote ID, retains historical flight telemetry for forensic "Prosecutor-Ready"
  reporting, and pushes instant notifications via SMS, Microsoft Teams, Slack, or
  CommandCentral Aware. SkySafe advertises integration APIs that push detection,
  forensics, and analytics into third-party command centers and mitigation
  workflows, but its developer surface (app.skysafe.io, docs.skysafe.io,
  api.skysafe.io) sits entirely behind customer authentication — there is no public
  developer portal, API reference, or OpenAPI specification to harvest.
